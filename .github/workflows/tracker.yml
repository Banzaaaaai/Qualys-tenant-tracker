name: Qualys Tenant Version Tracker

# Scheduling note (DST): GitHub Actions cron is fixed UTC. The target
# local schedule is 08:45 and 16:45 Europe/Amsterdam, which is
# UTC+1 (CET) in winter and UTC+2 (CEST) in summer. Rather than editing
# this file twice a year, we register BOTH UTC times for each local
# slot below; src/qualys_tracker/scheduling.py checks the real local
# time via zoneinfo and no-ops the "wrong season" trigger. This is
# robust across the actual DST transition dates without any manual
# cron edits. workflow_dispatch always bypasses the guard.
on:
  schedule:
    - cron: "45 7 * * *"   # 08:45 Europe/Amsterdam during CET (winter)
    - cron: "45 6 * * *"   # 08:45 Europe/Amsterdam during CEST (summer)
    - cron: "45 15 * * *"  # 16:45 Europe/Amsterdam during CET (winter)
    - cron: "45 14 * * *"  # 16:45 Europe/Amsterdam during CEST (summer)
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the current inventory even if nothing changed"
        type: boolean
        default: false
      send_test_email:
        description: "Send a test email to verify SMTP delivery, then exit"
        type: boolean
        default: false
      reset_baseline:
        description: >-
          DANGER: archives the current snapshot and starts a fresh baseline.
          Type CONFIRM (exact case) to actually do this. Leave blank otherwise.
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: qualys-tenant-version-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Run tracker
        id: run_tracker
        continue-on-error: true
        env:
          QUALYS_API_URL: ${{ secrets.QUALYS_API_URL }}
          QUALYS_USERNAME: ${{ secrets.QUALYS_USERNAME }}
          QUALYS_PASSWORD: ${{ secrets.QUALYS_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TENANT_IDENTIFIER: ${{ vars.TENANT_IDENTIFIER }}
          INITIAL_RUN_NOTIFY: ${{ vars.INITIAL_RUN_NOTIFY }}
          STALE_AFTER_DAYS: ${{ vars.STALE_AFTER_DAYS }}
          STALE_ALERT_SUPPRESSION_DAYS: ${{ vars.STALE_ALERT_SUPPRESSION_DAYS }}
          TRACKER_TIMEZONE: ${{ vars.TRACKER_TIMEZONE }}
          TRACKER_LOCAL_RUN_TIMES: ${{ vars.TRACKER_LOCAL_RUN_TIMES }}
          RUN_LOG_MAX_ENTRIES: ${{ vars.RUN_LOG_MAX_ENTRIES }}
          QUALYS_RELEASE_NOTES_URL: ${{ vars.QUALYS_RELEASE_NOTES_URL }}
          CHECK_PUBLIC_RELEASES: ${{ vars.CHECK_PUBLIC_RELEASES }}
          RELEASE_NOTES_CACHE_TTL_DAYS: ${{ vars.RELEASE_NOTES_CACHE_TTL_DAYS }}
          RELEASE_NOTES_BUDGET_SECONDS: ${{ vars.RELEASE_NOTES_BUDGET_SECONDS }}
          QUALYS_HTTP_TIMEOUT_SECONDS: ${{ vars.QUALYS_HTTP_TIMEOUT_SECONDS }}
          QUALYS_HTTP_MAX_RETRIES: ${{ vars.QUALYS_HTTP_MAX_RETRIES }}
          TRACKER_SCHEDULE_GUARD_TOLERANCE_MINUTES: ${{ vars.TRACKER_SCHEDULE_GUARD_TOLERANCE_MINUTES }}
          PUBLIC_RELEASE_NOTIFICATION: ${{ vars.PUBLIC_RELEASE_NOTIFICATION }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
          RESET_BASELINE: ${{ inputs.reset_baseline }}
        run: python -m qualys_tracker.main
        working-directory: .
        shell: bash

      - name: Preserve state and reset backups for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            tenant_snapshot.json
            tenant_snapshot.json.backup-*
            version_history.json
            run_log.json
            tenant_report.json
            tenant_report.md
            release_notes_cache.json
            public_release_notifications.json
            notification_outbox.json
            pending_transaction.json

      - name: Commit updated state
        id: persist
        if: always()
        run: |
          git config user.name "qualys-tenant-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # `git add` with multiple pathspecs fails ATOMICALLY (stages
          # nothing at all) if even one doesn't exist yet -- several of
          # these files (e.g. public_release_notifications.json) are only
          # created the first time their feature actually fires. Add each
          # one individually so a not-yet-created file can't silently
          # suppress every other file's update.
          for f in tenant_snapshot.json version_history.json run_log.json \
                   tenant_report.json tenant_report.md \
                   release_notes_cache.json public_release_notifications.json \
                   notification_outbox.json pending_transaction.json; do
            if [ -f "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update tenant version tracker state [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=true
                break
              fi
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort
                echo "::error::State conflicts with remote changes. Restore from the recovery artifact; no files were force-pushed."
                exit 1
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not persist state after three attempts. Recovery artifact is available."
              exit 1
            fi
          else
            echo "No state changes to commit."
          fi

      - name: Send external heartbeat after persisted successful check
        if: steps.run_tracker.outcome == 'success' && steps.persist.outcome == 'success'
        env:
          TRACKER_HEARTBEAT_URL: ${{ secrets.TRACKER_HEARTBEAT_URL }}
        run: |
          python - <<'PY'
          import os
          from qualys_tracker.run_log import load_run_log
          from qualys_tracker.heartbeat import ping_heartbeat
          records = load_run_log("run_log.json")
          current_run = os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"]
          if records and records[-1].get("github_run") == current_run and records[-1].get("success"):
              raise SystemExit(1 if ping_heartbeat() is False else 0)
          PY

      - name: Fail job if tracker run failed
        if: steps.run_tracker.outcome == 'failure'
        run: |
          echo "::error::Tracker run failed -- see the 'Run tracker' step output above for details (API, validation, or email failure)."
          exit 1
